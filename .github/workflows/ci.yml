name: DOTS Living Worlds CI

on:
  push:
    branches: [main, "release/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax and run tests
        run: npm run check
      - name: Verify production entry points
        run: |
          test -s index.html
          test -s styles.css
          test -s src/main.js
          test -s src/field.js
          test -s src/world.js
          test -s src/agents.js
          test -s src/nca.js
          test -s src/world-spec.js
          test -s tests/world-spec.test.mjs
          test -s tests/nca.test.mjs
          test -s tests/world.test.mjs
          test -s tests/agents.test.mjs
          test -s favicon.svg
          grep -q 'id="world-preset"' index.html
          grep -q 'id="zoom-in"' index.html
          grep -q 'id="tile-description"' index.html
          grep -q 'id="metric-inhabitants"' index.html
          grep -q 'id="metric-tick"' index.html
          grep -q 'id="nca-overlay"' index.html
          grep -q 'id="nca-step"' index.html
          grep -q 'id="compile-world-spec"' index.html
          grep -q 'id="apply-world-spec"' index.html
          grep -q '<span>v0.5</span>' index.html
          grep -q '<span>v0.4</span>' index.html
          grep -q 'id="metric-nca-cells"' index.html
      - name: Assert NCA and world-builder scope is accurately described
        run: |
          grep -qi "weights are not trained" index.html
          grep -qi "initialized weights; it has not been trained" index.html
          grep -q "not trained" docs/RELEASES/v0.4.md
          grep -qi "no LLM endpoint is connected" index.html
          grep -qi "deterministic and local" docs/RELEASES/v0.5.md
          grep -q "not a Neural Cellular Automaton" src/field.js
      - name: Verify isolated hosting documentation
        run: |
          grep -qi "do not attach" README.md
          grep -q "sohan-a11y.github.io" docs/ARCHITECTURE_AND_HOSTING.md
